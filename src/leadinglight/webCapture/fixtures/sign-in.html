<!doctype html>
<!-- Synthetic fixture written for LeadingLight tests: a sign-in wall in front of an article. -->
<html>
<head><title>Sign in to continue reading | Harbour Notes</title></head>
<body>
  <main>
    <h1>Sign in to continue reading</h1>
    <p>This article is available to members. Sign in with your Harbour Notes account to keep reading, or create a free account in less than a minute.</p>
    <form action="/login" method="post">
      <label>Email <input type="email" name="email"></label>
      <label>Password <input type="password" name="password"></label>
      <button>Sign in</button>
    </form>
    <p><a href="/forgot">Forgot your password?</a> <a href="/join">Create an account</a></p>
  </main>
</body>
</html>
