services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leadinglight
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: leadinglight
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["cloud-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadinglight"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  cloud-data:
