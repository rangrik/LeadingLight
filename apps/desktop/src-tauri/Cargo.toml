[package]
name = "leadinglight-desktop"
version = "0.1.0"
description = "LeadingLight desktop app"
edition = "2024"

[lib]
# Lib name must differ from the bin name (Windows clash, cargo#8519).
name = "leadinglight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the capture box is a transparent window (tauri.conf.json, macOSPrivateApi).
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-fs = "2.7.1"
# The idea capture box (capture.rs): a Spotlight-style panel, a global shortcut, open at login.
tauri-nspanel = "2.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
