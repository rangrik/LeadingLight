[package]
name = "leadinglight-desktop"
version = "0.1.0"
description = "LeadingLight desktop app"
edition = "2024"

[lib]
# Lib name must differ from the bin name (Windows clash, cargo#8519).
name = "leadinglight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
