[package]
name = "leadinglight-desktop"
version = "0.3.0"
description = "LeadingLight desktop app"
edition = "2024"

[lib]
# Lib name must differ from the bin name (Windows clash, cargo#8519).
name = "leadinglight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri gates the capture panel's private window API to macOS internally.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# The capture panel, global shortcut and login item belong to the Mac app.
tauri-nspanel = "2.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-leadinglight-preview = { path = "preview" }
