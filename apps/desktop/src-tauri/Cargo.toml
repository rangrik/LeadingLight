[package]
name = "leadinglight-desktop"
version = "0.13.0"
description = "LeadingLight desktop app"
edition = "2024"

[lib]
# Lib name must differ from the bin name (Windows clash, cargo#8519).
name = "leadinglight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri gates the capture panel's private window API to macOS internally.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# The capture panel, global shortcut and login item belong to the Mac app.
tauri-nspanel = "2.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# The Mac app installs its own updates; iPhone and iPad get theirs from TestFlight.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The browser space's pages (native_browser.rs) are WKWebViews made with wry, the crate Tauri uses.
wry = { version = "0.57", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSURL", "NSURLRequest", "NSURLError", "NSData", "NSDictionary", "NSSet", "NSValue", "NSBundle", "NSProcessInfo", "NSUUID", "NSError", "NSKeyValueObserving"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core", "NSResponder", "NSView", "NSWindow", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "NSColor"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKFrameInfo", "WKContentWorld"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-leadinglight-preview = { path = "preview" }
tauri-plugin-leadinglight-notifications = { path = "notifications" }
