<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700"><rect width="1200" height="1700" fill="#f4f1de"/><g fill="#234c37" font-family="Helvetica,Arial,sans-serif"><text x="140" y="160" font-size="24" letter-spacing="4">A WORK IN PROGRESS</text><text x="140" y="390" font-size="82" letter-spacing="-4">One thing</text><text x="140" y="485" font-size="82" letter-spacing="-4">leads to</text><text x="140" y="580" font-size="82" letter-spacing="-4">another.</text><g stroke="#c3c8b8" stroke-width="2"><path d="M140 740H980 M140 800H1000 M140 860H950 M140 920H1000 M140 980H680"/></g><rect x="130" y="1100" width="850" height="210" rx="3" fill="#dce5c7"/><text x="165" y="1170" font-size="25">A note in the margin:</text><text x="165" y="1220" font-size="25">Ideas grow when they have</text><text x="165" y="1270" font-size="25">somewhere to meet.</text><text x="1020" y="1550" font-size="22">002</text></g></svg>
