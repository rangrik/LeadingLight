name: Publish release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      rehearsal:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing draft tag to retry, for example v0.2.0'
        type: string
      rehearsal:
        description: 'Build main and save artifacts without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.draft.outputs.sha }}
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Resolve the draft's exact commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          REHEARSAL: ${{ inputs.rehearsal }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$REHEARSAL" = true ] && [ -n "$TAG" ]; then
            echo '::error::Leave the tag blank for a rehearsal, or disable rehearsal to publish that draft.'
            exit 1
          fi
          if [ "$REHEARSAL" != true ] && [ -z "$TAG" ]; then
            echo '::error::Enter the existing draft tag to publish.'
            exit 1
          fi
          if [ "$REHEARSAL" = true ]; then
            sha="$SOURCE_SHA"
            TAG="v$(gh api "repos/$GH_REPO/contents/version.txt?ref=$sha" --jq .content | base64 --decode | tr -d '\n')"
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release view "$TAG" --json isDraft,targetCommitish > release.json
            jq -e '.isDraft == true' release.json
            sha=$(jq -r .targetCommitish release.json)
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: draft
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.draft.outputs.sha }}

  macos:
    needs: [draft, checks]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release identity
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ "$REHEARSAL" != true ]; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          node scripts/release/check-version.mjs "$TAG"
          test "$(uname -m)" = arm64
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.1'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-macos-arm64
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Build pinned runtime and tmux
        run: pnpm runtime:build
      - name: Build the app and disk image
        run: pnpm --filter @leadinglight/desktop tauri build --bundles app,dmg -- --locked
      - name: Verify and package downloads
        run: scripts/release/package-macos.sh "$TAG"
      - name: Preserve build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LeadingLight-${{ needs.draft.outputs.tag }}-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Summarize rehearsal
        if: inputs.rehearsal
        run: echo 'Rehearsal passed. Downloads are in the workflow artifacts; no release was published.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [draft, macos]
    if: ${{ !inputs.rehearsal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LeadingLight-${{ needs.draft.outputs.tag }}-macos-arm64
          path: release-assets
      - name: Upload and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx true
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          gh release upload "$TAG" release-assets/* --clobber
          id=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          gh api "repos/$GH_REPO/releases/$id/assets" > assets.json
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const assets = JSON.parse(readFileSync('assets.json'));
          const files = readdirSync('release-assets');
          assert.equal(files.length, 3);
          assert.equal(assets.length, 3);
          for (const name of files) {
            const path = `release-assets/${name}`;
            const asset = assets.find(a => a.name === name);
            assert.equal(asset?.state, 'uploaded');
            assert.equal(asset.size, statSync(path).size);
            assert.equal(asset.digest, `sha256:${createHash('sha256').update(readFileSync(path)).digest('hex')}`);
          }
          JS
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ### Download
          Apple Silicon (M-series), macOS 13 or later. Voice transcription requires macOS 26.
          Use the DMG to install, or the ZIP for the app bundle. SHA256SUMS.txt verifies either download.

          **Unsigned preview:** this build is ad-hoc signed, without an Apple Developer ID or notarization.
          macOS may block it or require approval in Privacy & Security. It is intended for early testing.
          NOTES
          gh release edit "$TAG" --title "LeadingLight $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
