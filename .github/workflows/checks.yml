name: Checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leadinglight
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: leadinglight
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U leadinglight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://leadinglight:local-development-only@127.0.0.1:55439/leadinglight
      QA_PORT: 1420
      PUBLISH_QA: 1
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/check-version.mjs
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm check:themes
      - run: pnpm --filter @leadinglight/desktop test
      - run: pnpm --filter @leadinglight/image-service test
      - run: pnpm --filter @leadinglight/cloud test
      - run: pnpm --filter @leadinglight/desktop build
      - run: pnpm --filter @leadinglight/docs build
      - name: Bypass the slow AWS Ubuntu mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^http://us-east-2\.ec2\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi
      - run: pnpm --filter @leadinglight/desktop exec playwright install --with-deps chromium webkit
      - name: Start isolated cloud fixtures
        run: |
          node apps/cloud/test/browser-server.mjs > /tmp/leadinglight-cloud-qa.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/api/config
      - name: Browser smoke and recorded feature checks
        run: pnpm --filter @leadinglight/desktop exec playwright test -c qa/playwright.config.ts --project=qa --project=safari smoke.spec.ts saving.spec.ts unsplash.spec.ts gmail.spec.ts publishing.spec.ts app-update.spec.ts sidebar-modes.spec.ts browser-space.spec.ts browser-ask.spec.ts panes.spec.ts pages.spec.ts
      - name: Keep review videos and test report
        if: always()
        id: review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ref || 'branch' }}
          path: |
            apps/desktop/qa/.results
            apps/desktop/qa/report/playwright
            /tmp/leadinglight-cloud-qa.log
          retention-days: 30
          include-hidden-files: true
      - name: Link review recording
        if: always() && steps.review.outputs.artifact-url != ''
        run: echo '[Download test videos and HTML report](${{ steps.review.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
