name: Checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/check-version.mjs
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm check:themes
      - run: pnpm --filter @leadinglight/desktop test
      - run: pnpm --filter @leadinglight/image-service test
      - run: pnpm --filter @leadinglight/desktop build
      - run: pnpm --filter @leadinglight/docs build
      - run: pnpm --filter @leadinglight/desktop exec playwright install --with-deps chromium
      - name: Browser smoke
        run: pnpm --filter @leadinglight/desktop exec playwright test -c qa/playwright.config.ts --project=qa smoke.spec.ts saving.spec.ts unsplash.spec.ts
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: apps/desktop/qa/.results
          retention-days: 7
