name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Finish any previous draft first
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          drafts=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft) | .tag_name')
          if [ -n "$drafts" ]; then
            echo "::error::An unfinished draft exists: $drafts. Run Publish release with that tag first."
            exit 1
          fi
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release

  publish:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
