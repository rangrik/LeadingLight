[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri"]

# Size tuning, see https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc macros are libraries loaded during the build; macOS 27 refuses to load them once stripped.
[profile.release.build-override]
strip = false
